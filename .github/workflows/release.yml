# ============================================================
# GitHub Actions CI/CD：自动构建 & 发布 Electron 应用
#
# 工作原理：
# 1. 你在本地创建一个版本 tag（如 v1.0.0）并 push 到 GitHub
# 2. GitHub 检测到 tag 推送，自动触发这个工作流
# 3. 在 3 个平台（macOS/Windows/Linux）上并行构建安装包
# 4. 构建完成后，自动创建 GitHub Release 页面并上传安装包
# 5. 用户可以从 Release 页面下载对应平台的安装包
#
# 使用方法：
#   git tag v1.0.0          # 创建版本标签
#   git push origin v1.0.0  # 推送标签到 GitHub，自动触发构建
#
# 也可以在 GitHub 网页上手动触发（Actions → Build & Release → Run workflow）
# ============================================================

name: Build & Release

# ===== 触发条件 =====
on:
  push:
    tags:
      - 'v*' # 只有推送 v 开头的 tag 才触发（如 v1.0.0, v2.1.3）
  workflow_dispatch: # 允许从 GitHub Actions 页面手动触发（调试用）

# ===== 构建任务 =====
jobs:
  build:
    # 矩阵策略：同时在多个操作系统上运行，互不影响
    strategy:
      matrix:
        include:
          - os: macos-latest    # macOS ARM64 构建机 → 产出 arm64 .dmg 和 .zip
            platform: mac
            arch: arm64
          - os: macos-latest    # macOS ARM64 构建机 → 交叉编译产出 x64 .dmg 和 .zip
            platform: mac
            arch: x64
          - os: windows-latest  # Windows 构建机 → 产出 .exe 安装包
            platform: win
            arch: x64
          - os: ubuntu-latest   # Linux 构建机 → 产出 .AppImage
            platform: linux
            arch: x64

    # 每个矩阵项在对应的操作系统上运行
    runs-on: ${{ matrix.os }}

    steps:
      # 第1步：拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 第2步：安装 Node.js（使用 npm cache 加速后续安装）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 第3步：安装项目依赖（ci 比 install 更快且更严格，使用 lock 文件精确还原）
      - name: Install dependencies
        run: npm ci

      # 第4步：构建代码 + 打包为对应平台的安装包
      # GH_TOKEN 用于 electron-builder 下载 Electron 二进制文件（避免限速）
      - name: Build & Package
        run: npm run build && npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 第5步：上传构建产物（供后续 release job 使用）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore # 某些平台可能不产出某些格式，忽略即可

  # ===== 发布任务（仅 tag 触发时执行） =====
  release:
    needs: build # 等待所有平台构建完成
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # 仅 tag 推送时发布，手动触发不发布
    permissions:
      contents: write # 需要写权限才能创建 Release

    steps:
      # 下载上一步所有平台的构建产物
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # 合并所有平台的文件到同一目录

      # 创建 GitHub Release 并上传所有安装包
      # beta/rc 版本自动标记为 Pre-release，正式版标记为 Latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*          # 上传所有下载的构建产物
          generate_release_notes: true   # 自动生成 Release Notes（基于 commit 历史）
          draft: false                   # 直接发布（设为 true 则创建草稿，需手动发布）
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动提供，无需手动配置
